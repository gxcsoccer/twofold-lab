# Twofold Lab out-of-tree dsh.bundle for DeepSeek Harness b150a551.
# Applied after @deepseek-ai/dsh-base and before the profile's own patch.

# Lock 1: the default model used by every new Twofold Agent.
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

# Prevent hot-reloaded user settings from widening the model catalog or
# replacing the default selection. Credential resolution remains provided by
# the independent credentials-local row.
- id: settings
  disabled: true

- id: llm-pi-ai
  disabled: true

# Lock 2: advertise only DeepSeek V4 Pro. The preset plugin owns Lock 3 on the
# agent/request waterfall, because this adapter deliberately accepts unlisted
# pass-through model ids.
- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    models:
      - id: deepseek-v4-pro
        name: DeepSeek V4 Pro
        description: Locked Twofold Lab decision model
        contextWindow: 1000000
        maxTokens: 256000
        inputModalities: [text]
    retryPolicy:
      mode: normal
      maxRetries: 0

# A decision run owns one model call. Do not start a second model call merely
# to title the Harness Session.
- id: session-title-llm
  disabled: true

# Remove every generic model-facing capability inherited from dsh-base. The
# scoped Twofold plugin also applies an empty global allowlist and a final
# monotonic guard, so a later accidental Host registration still cannot run.
- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: tool-str-replace-editor
  disabled: true

- id: agent-instructions
  disabled: true

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

- id: tool-goal
  disabled: true

- id: tool-todo
  disabled: true

- id: plan-mode
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: tool-subagent-report
  disabled: true

- id: workflow-worker-thread
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-ralph
  disabled: true

- id: web
  disabled: true

- id: web-search-deepseek
  disabled: true

- id: tool-web
  disabled: true

# Dedicated, read-only preset roster. The profile is rooted under DSH_HOME, so
# this path works both in this repository and after copying the profile as a
# deployment unit.
- insert:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: twofold
        roots:
          - path: !!js dshHomePath('profiles', 'twofold', 'agent-presets')
            trust: system
        includeUserRoot: false
